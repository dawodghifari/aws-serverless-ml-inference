# Unit tests, template lint and an image build. The tests replace ONNX Runtime
# and DynamoDB with fakes, so nothing here needs a model file or AWS credentials.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt ruff==0.7.4

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -q tests

  template:
    name: Lint SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cfn-lint
        run: |
          pip install cfn-lint==1.57.2
          cfn-lint template.yaml

  image:
    name: Build Lambda image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # No model is baked in here (model/ holds only .gitkeep); this checks that
      # the Dockerfile and app/requirements.txt still build for x86_64 Lambda.
      - name: Build
        run: docker build -t ml-inference:ci app
